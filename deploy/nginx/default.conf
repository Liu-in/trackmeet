# ============================================================================
# 田径运动会编排软件 TrackMeet —— 前端 Nginx 站点配置
# 挂载位置： ./nginx/default.conf → /etc/nginx/conf.d/default.conf（只读）
# ----------------------------------------------------------------------------
# 职责：
#   1) 托管 Vue 3 构建产物（SPA history 模式回退）
#   2) /api → 反代后端容器 backend:8080（同源部署，浏览器无跨域）
#   3) gzip 压缩、静态资源长缓存、安全响应头、健康检查端点
# 说明：本文件由 conf.d 包含进 http 上下文，因此顶层 map / log_format 合法。
# 注意：同一 location 内一旦出现 add_header，父级 add_header 不再继承，
#       故静态资源与 index.html 两个 location 显式重复安全响应头。
# ============================================================================

# WebSocket / SSE 升级头（无 Upgrade 请求时置空，保证 keepalive 不被破坏）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 访问日志格式：含处理耗时、上游耗时、真实客户端 IP，便于定位慢接口
log_format trackmeet_main
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt=$upstream_response_time ua="$upstream_addr" '
    'xfwd="$http_x_forwarded_for" host="$host"';

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    charset       utf-8;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # 说明：本文件的 proxy_pass 均使用字面量上游（backend:8080），
    #       由 nginx 在启动时解析一次，无需 resolver 指令；
    #       若将来改为变量形式（$backend_upstream），再补 resolver 127.0.0.11 valid=10s;
    access_log /var/log/nginx/access.log trackmeet_main;
    error_log  /var/log/nginx/error.log warn;

    # Excel 导入等上传（后端 multipart 上限 20MB / 单请求 50MB）
    client_max_body_size 20m;
    client_body_timeout  300s;
    keepalive_timeout    75s;
    send_timeout         300s;

    # ------------------------------------------------------------------
    # gzip：文本类资源压缩；图片/字体本身已压缩，无需再压
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # ------------------------------------------------------------------
    # 安全响应头（见各 location 的重复声明说明）
    #   X-Frame-Options=SAMEORIGIN：仅阻止被其他站点 iframe 嵌套，
    #   同源 iframe / window.print() 打印预览不受影响（如需禁止同源嵌套可改 DENY）
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # ------------------------------------------------------------------
    # 健康检查：容器 healthcheck 与负载均衡探针使用，不写访问日志
    # ------------------------------------------------------------------
    location = /health {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # 静态资源：文件名带内容哈希，长缓存 30 天
    # ------------------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        access_log off;
        try_files $uri =404;
    }

    # 图片 / 字体 / 图标等公共静态文件：中等缓存
    location ~* \.(?:png|jpe?g|gif|webp|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html 绝不缓存，保证发版后立即拿到新资源引用
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        expires -1;
    }

    # ------------------------------------------------------------------
    # 大屏长连接 / SSE：关闭缓冲与缓存，超时放宽到 1 小时
    #（必须放在 /api/ 之前，nginx 前缀匹配取最长者，此处显式声明便于阅读）
    # ------------------------------------------------------------------
    location /api/screen/ {
        proxy_pass         http://backend:8080/api/screen/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # 后端 API 反向代理（保留 X-Meet-Id 等自定义头，默认全部透传）
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # 后端健康检查透传（可选，便于从 80 端口统一探活）
    location = /api-health {
        access_log off;
        proxy_pass         http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # 前端路由：Vue Router history 模式回退到 index.html
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件（.env、.git 等）一律不可访问
    location ~ /\. {
        deny all;
    }
}
